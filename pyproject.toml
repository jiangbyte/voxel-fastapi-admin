[project]
name = "voxel-fastapi-admin"
version = "1.1.0-SNAPSHOT"
description = "Voxel FastAPI admin · flat DDD (no src/)"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "alibabacloud-dm20151123>=1.0.0",
  "alibabacloud-dysmsapi20170525>=1.0.0",
  "alibabacloud-tea-openapi>=0.3.0",
  "authlib>=1.3.0",
  "bcrypt>=5.0.0",
  "blinker>=1.9.0",
  "boto3>=1.39.0",
  "captcha>=0.7.0",
  "croniter>=3.0.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "greenlet>=3.2.0",
  "gunicorn>=23.0.0",
  "hvac>=2.4.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "opentelemetry-api>=1.36.0",
  "opentelemetry-exporter-otlp>=1.36.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-instrumentation-httpx>=0.57b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
  "opentelemetry-sdk>=1.36.0",
  "orjson>=3.10.0",
  "oss2>=2.19.0",
  "prometheus-client>=0.22.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "redis>=6.2.0",
  "snowflake-id>=1.0.2",
  "sqlalchemy>=2.0.41",
  "structlog>=24.0.0",
  "tencentcloud-sdk-python-ses>=3.1.135",
  "tencentcloud-sdk-python-sms>=3.1.153",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voxel_types", "api", "domain", "infrastructure", "cases", "trigger", "app"]

[tool.setuptools.package-dir]
"" = "."
